<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FFN Enhancements</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 240px;
      font-family: Verdana, Arial, sans-serif;
      font-size: 13px;
      background: #fff;
      color: #333;
    }
    .header {
      background: #29297a;
      color: #fff;
      padding: 10px 12px;
      font-weight: bold;
      font-size: 14px;
    }
    .body {
      padding: 12px;
    }
    button {
      display: block;
      width: 100%;
      padding: 8px 12px;
      margin-bottom: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #f0f0f7;
      color: #1f1f5c;
      font-family: inherit;
      font-size: 13px;
      cursor: pointer;
      text-align: left;
    }
    button:hover {
      background: #e6e6f2;
    }
    button:last-child { margin-bottom: 0; }
  </style>
</head>
<body>
  <div class="header">FFN Enhancements</div>
  <div class="body">
    <button id="btn-settings">Settings</button>
    <button id="btn-ffn">Open FanFiction.net</button>
    <button id="btn-ao3">Open AO3</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
